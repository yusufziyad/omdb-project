<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        
        <header>
            <h1>Movie Search</h1>
            <p>Enter a movie name to find details.</p>
        </header>

        <div class="search-section">
            <input type="text" id="movieInput" placeholder="e.g. Eyes Wide Shut...">
            <button id="searchBtn">Search</button>
        </div>

        <p id="errorMsg" class="error-text"></p>

        <div id="movieResult" class="movie-card hidden">
            <!-- JavaScript ile API'den gelen verileri buraya dolduracağız -->
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
